name: Prune Reports

on:
  schedule:
    - cron: '0 14 * * *'  # daily at 14:00 UTC
  workflow_dispatch:
    inputs:
      clean_all:
        description: "Delete ALL reports, not just those older than 7 days"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Delete reports
        run: |
          if [ "${{ github.event.inputs.clean_all }}" = "true" ]; then
            python prune_reports.py --max-age-days 0
          else
            python prune_reports.py --max-age-days 7
          fi

      - name: Commit pruned reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Prune reports older than 7 days ($(date -u +%Y-%m-%d))"
          git push
